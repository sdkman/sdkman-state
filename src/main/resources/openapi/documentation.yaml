openapi: "3.1.0"
info:
  title: "sdkman_state API"
  description: "sdkman_state API"
  version: "1.0.0"
servers:
  - url: "https://state.sdkman.io"
  - url: "http://localhost:8080"
paths:
  /meta/health:
    get:
      description: ""
      responses:
        "503":
          description: "Service Unavailable"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
  /versions:
    delete:
      description: ""
      security:
        - bearerAuth: []
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UniqueVersion"
        required: true
      responses:
        "400":
          description: "Bad Request - Validation failed. Java is rejected for every caller, and the message names DELETE /versions/java, the only route that deletes a java version."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example#1:
                  description: ""
                  value:
                    error: "Validation failed"
                    message: "null"
                java_candidate:
                  description: "Java belongs on DELETE /versions/java"
                  value:
                    error: "Bad Request"
                    message: "candidate 'java' is not accepted here; use DELETE /versions/java"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
        "401":
          description: "Unauthorized - Missing or invalid token"
        "403":
          description: "Forbidden - Vendor not authorized for this candidate, or a role not admitted. Admin and community tokens may write any candidate; a vendor token only its own candidates; any other role is refused."
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "object"
        "409":
          description: "Conflict - Version has active tags that must be removed or reassigned before deletion"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/TagConflictResponse"
              examples:
                Example#1:
                  description: "Version has active tags"
                  value:
                    error: "Conflict"
                    message: "Cannot delete version with active tags. Remove or reassign the following tags first."
                    tags:
                      - "latest"
                      - "27"
                      - "27.0"
    post:
      description: "Create or update a version of any registered candidate but java. The version must not be blank and is otherwise stored as posted: no format is enforced. Visibility is stored as posted, absent meaning true, and the post hides no other version. Java is rejected with 400 for every caller, identifying the candidate field and naming POST /versions/java, the only route that writes a java version."
      security:
        - bearerAuth: []
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Version"
        required: true
      responses:
        "400":
          description: "Bad Request - Validation failed. The candidate must be registered in the candidate registry; an unregistered candidate is rejected here, and the message enumerates the registered candidates sorted ascending."
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                validation_error:
                  summary: "Standard validation failure"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "url"
                        message: "URL 'http://example.com' must be a valid HTTPS URL"
                java_candidate:
                  summary: "Java belongs on POST /versions/java"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "candidate"
                        message: "candidate 'java' is not accepted here; use POST /versions/java"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
        "401":
          description: "Unauthorized - Missing or invalid token"
        "403":
          description: "Forbidden - Vendor not authorized for this candidate, or a role not admitted. Admin and community tokens may write any candidate; a vendor token only its own candidates; any other role is refused."
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - a database error, or a candidate registry that has never loaded successfully. The registry answers the candidate check, so until it loads once no publish can be validated; this is reported here and never as a validation failure."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example#1:
                  description: ""
                  value:
                    error: "Database error"
                    message: "null"
                registry_unavailable:
                  description: "The candidate registry has never loaded successfully"
                  value:
                    error: "Internal Server Error"
                    message: "Candidate registry unavailable"
  /versions/tags:
    delete:
      description: "Remove a tag by its unique scope (candidate, tag, distribution, platform)"
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/UniqueTag"
            examples:
              with_distribution:
                summary: "Delete a tag with distribution"
                value:
                  candidate: "java"
                  tag: "latest"
                  distribution: "TEMURIN"
                  platform: "LINUX_X64"
              without_distribution:
                summary: "Delete a tag without distribution"
                value:
                  candidate: "gradle"
                  tag: "latest"
                  platform: "UNIVERSAL"
        required: true
      responses:
        "204":
          description: "No Content - Tag successfully removed"
        "400":
          description: "Bad Request - Validation errors or malformed JSON"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                validation_error:
                  summary: "Accumulated validation failures"
                  value:
                    error: "Validation Error"
                    failures:
                      - field: "candidate"
                        message: "Candidate must not be blank"
                      - field: "tag"
                        message: "Tag must not be blank"
        "401":
          description: "Unauthorized - Missing or invalid authentication"
        "403":
          description: "Forbidden - Vendor not authorized for this candidate, or a role not admitted. Java tags are admin-only: every other role is refused java, the community role and a vendor with java in scope included. For any other candidate, admin and community tokens may write it; a vendor token only its own candidates; any other role is refused."
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Tag does not exist for the given scope"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  summary: "Tag not found"
                  value:
                    error: "Not Found"
                    message: "Tag 'nonexistent' not found"
    post:
      description: "Assign a single tag to an existing version (append, not replace). The tag is added to the target version's existing tag set; a tag held by another version in the same (candidate, distribution, platform) scope is moved; re-assigning a tag the version already holds is an idempotent no-op. Never creates a version. No semverish validation is applied to the version field."
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/TagAssignment"
            examples:
              with_distribution:
                summary: "Assign a tag with distribution"
                value:
                  candidate: "java"
                  version: "27.0.2"
                  distribution: "TEMURIN"
                  platform: "LINUX_X64"
                  tag: "latest"
              without_distribution:
                summary: "Assign a tag without distribution"
                value:
                  candidate: "gradle"
                  version: "8.12"
                  platform: "UNIVERSAL"
                  tag: "latest"
        required: true
      responses:
        "204":
          description: "No Content - Tag assigned, moved, or already present (no-op)"
        "400":
          description: "Bad Request - Validation errors or malformed JSON"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                validation_error:
                  summary: "Accumulated validation failures"
                  value:
                    error: "Validation Error"
                    failures:
                      - field: "candidate"
                        message: "Candidate must not be blank"
                      - field: "version"
                        message: "Version must not be blank"
                      - field: "tag"
                        message: "Tag must match the pattern ^[a-zA-Z0-9]([a-zA-Z0-9._-]{0,48}[a-zA-Z0-9])?$"
        "401":
          description: "Unauthorized - Missing or invalid authentication"
        "403":
          description: "Forbidden - Vendor not authorized for this candidate, or a role not admitted. Java tags are admin-only: every other role is refused java, the community role and a vendor with java in scope included. For any other candidate, admin and community tokens may write it; a vendor token only its own candidates; any other role is refused."
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Target version does not exist for the given coordinates"
        "500":
          description: "Internal Server Error - Database error"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                database_error:
                  summary: "Database error"
                  value:
                    error: "Database error"
                    message: "null"
  /versions/java:
    post:
      description: "Create or update a java version. The route fixes the candidate, so the body carries no candidate field. Java must be registered in the candidate registry, as POST /versions requires its candidate. The caller decides what the post does. A vendor with java in scope publishes: its version must conform to FEATURE.INTERIM.UPDATE.PATCH[.N...][-fx|-crac][+build-metadata], it sends neither visible nor tags, and State orders the post against the head of its series. A series is the readable java rows sharing distribution, platform, FEATURE, release line (the feature line when INTERIM is 0, the interim line otherwise) and variant (fx, crac or none); its head is its highest visible member. For comparison only, a stored row is read with a three-component core padded to four and a legacy .fx or .crac read as -fx or -crac; the stored string is never rewritten. A row that still fails the grammar belongs to no series: a post never hides it and it never blocks one. Versions order by numeric core, element by element, then by build metadata at equal core: +ea.N by N, below no build metadata, below numeric builds (+N, +N.N) compared left to right numerically. Any other build metadata cannot be ordered at equal core against different metadata or none. A post that beats the head, is the head, or enters a series with no visible member is stored visible, and every other visible member of the series is hidden. On a plain series (no variant) it then takes the <FEATURE> tag and latest when it beats their holder, when they have no holder, or when the holder is unreadable, and it takes lts only when a row of its own series holds it. Tags are scoped to the post's distribution and platform, and an fx or crac post moves no tag. A post that ranks below the head is stored hidden and gains no tag. A post that cannot be ordered against the head is refused with 409, and no row or tag is written. The admin overrides, and no ordering applies: visible true or absent makes the posted row the only visible row of its series, and visible false hides only the posted row. The posted row ends up holding exactly the listed tags, absent meaning none: a listed tag moves onto it from whichever row held it, and no other tag moves. The admin may also post a legacy version that fails the grammar; it is stored as given, with its visibility and tags, and hides nothing. Every other caller is refused with 403, the community role and a vendor without java in scope included. A post's upsert, hides and tag moves commit together, and java posts and deletes for one distribution and platform take effect one at a time. Each hidden row gets a RETIRE audit entry and a refusal a REFUSE entry, both attributed to the poster."
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/JavaVersion"
            examples:
              vendor_publish:
                summary: "A vendor publishes; State decides visibility and tags"
                value:
                  version: "25.0.5.0+3"
                  distribution: "TEMURIN"
                  platform: "LINUX_X64"
                  url: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B3/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_3.tar.gz"
              admin_override:
                summary: "The admin stores the row visible, holding exactly the listed tags"
                value:
                  version: "25.0.4.0+9"
                  distribution: "TEMURIN"
                  platform: "LINUX_X64"
                  url: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4%2B9/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4_9.tar.gz"
                  visible: true
                  tags:
                    - "lts"
        required: true
      responses:
        "204":
          description: "No Content - Stored: as the series head, as a hidden row, or as the admin posted it"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: "Bad Request - Validation failed, and nothing is written. A field fails validation; a vendor's version fails the grammar; a vendor body carries visible or tags, and the failure names the field; the body carries candidate; the body is not valid JSON; or java is not registered in the candidate registry, which is a failure on the request field naming java."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                grammar_error:
                  summary: "A vendor's version fails the grammar"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "version"
                        message: "Version '25.0.5' does not conform to the semverish format: FEATURE.INTERIM.UPDATE.PATCH[.N...][-fx|-crac][+build-metadata]"
                server_decided_field:
                  summary: "A vendor body carries tags"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "tags"
                        message: "tags is decided by the server on a vendor post and must be omitted"
                candidate_fixed_by_route:
                  summary: "The body carries candidate"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "candidate"
                        message: "candidate is fixed by POST /versions/java and must be omitted"
                java_unregistered:
                  summary: "Java is not registered in the candidate registry"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "request"
                        message: "Invalid request: candidate 'java' is not registered"
        "401":
          description: "Unauthorized - Missing or invalid token"
        "403":
          description: "Forbidden - The caller may not write java, whatever the body: the community role, a vendor without java in scope, or an unknown role. Only the admin and a vendor with java in scope may post."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_authorized:
                  summary: "A caller that may not write java"
                  value:
                    error: "Forbidden"
                    message: "Not authorized for candidate: java"
        "409":
          description: "Conflict - A vendor post cannot be ordered against the head of its series, and the message names the head's version. No row or tag is written, and a REFUSE audit entry records the refusal."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unordered_head:
                  summary: "Unknown build metadata on the head cannot be ordered against the post"
                  value:
                    error: "Conflict"
                    message: "Cannot order version '21.0.9.0+1' against the series head '21.0.9.0+r17'."
        "500":
          description: "Internal Server Error - a database error, answered with error \"Database error\", or a candidate registry that has never loaded successfully, as on POST /versions"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                registry_unavailable:
                  summary: "The candidate registry has never loaded successfully"
                  value:
                    error: "Internal Server Error"
                    message: "Candidate registry unavailable"
    delete:
      description: "Delete one java row, as DELETE /versions deletes a row of any other candidate. The route fixes the candidate, so the body carries no candidate field. The version is any stored string, legacy spellings included. The admin and a vendor with java in scope may delete; every other caller is refused with 403. A delete promotes nothing: deleting a series head leaves the series without a visible member until the next post. A tagged row cannot be deleted. Java posts and deletes for one distribution and platform take effect one at a time."
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/JavaUniqueVersion"
            examples:
              with_distribution:
                summary: "Delete a java row"
                value:
                  version: "25.0.3.0"
                  distribution: "TEMURIN"
                  platform: "LINUX_X64"
        required: true
      responses:
        "204":
          description: "No Content - The row is deleted"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStoreWrite"
        "400":
          description: "Bad Request - The body is malformed or carries candidate, or the version is blank"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStoreWrite"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                blank_version:
                  summary: "A blank version"
                  value:
                    error: "Bad Request"
                    message: "version cannot be empty"
        "401":
          description: "Unauthorized - Missing or invalid token"
        "403":
          description: "Forbidden - The caller may not delete java: the community role, a vendor without java in scope, or an unknown role. Only the admin and a vendor with java in scope may delete."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStoreWrite"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_authorized:
                  summary: "A caller that may not delete java"
                  value:
                    error: "Forbidden"
                    message: "Not authorized for candidate: java"
        "404":
          description: "Not Found - No java row matches the version, distribution and platform"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStoreWrite"
        "409":
          description: "Conflict - The row has active tags that must be removed or reassigned before deletion"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStoreWrite"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/TagConflictResponse"
              examples:
                tagged_row:
                  summary: "The row has active tags"
                  value:
                    error: "Conflict"
                    message: "Cannot delete version with active tags. Remove or reassign the following tags first."
                    tags:
                      - "lts"
                      - "25"
  /login:
    post:
      description: "Authenticate and obtain a JWT token. The token role is \"admin\", \"vendor\" or \"community\". Login checks the admin account first, then the optional community account, then the vendors table. A community token carries the fixed vendor_id \"00000000-0000-0000-0000-000000000001\", the community account email and an empty candidates list; with no community account configured, a community login fails with 401."
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "OK - Authentication successful"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: "Unauthorized - Invalid credentials"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "Too Many Requests - Rate limit exceeded"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - Token creation failed"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/vendors:
    get:
      description: "List all vendors"
      security:
        - bearerAuth: []
      parameters:
        - name: "include_deleted"
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: false
          description: "Include soft-deleted vendors in the response"
      responses:
        "200":
          description: "OK"
          content:
            'application/json':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/VendorResponse"
        "401":
          description: "Unauthorized - Missing, invalid, or non-admin token"
    post:
      description: "Create or update a vendor"
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/CreateVendorRequest"
        required: true
      responses:
        "201":
          description: "Created - New vendor created"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/VendorWithPasswordResponse"
        "200":
          description: "OK - Existing vendor updated or resurrected"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/VendorWithPasswordResponse"
        "400":
          description: "Bad Request - Validation errors"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_email:
                  summary: "Invalid email format"
                  value:
                    error: "Bad Request"
                    message: "Invalid email format"
                empty_candidates:
                  summary: "Empty candidates list"
                  value:
                    error: "Bad Request"
                    message: "Candidates list cannot be empty"
                admin_email:
                  summary: "Admin email collision"
                  value:
                    error: "Bad Request"
                    message: "Cannot use admin email"
        "401":
          description: "Unauthorized - Missing, invalid, or non-admin token"
  /admin/vendors/{id}:
    delete:
      description: "Soft delete a vendor"
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "OK - Vendor soft deleted"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/VendorResponse"
        "401":
          description: "Unauthorized - Missing, invalid, or non-admin token"
        "404":
          description: "Not Found - Vendor not found or already deleted"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /candidates:
    get:
      description: "List the candidate registry. Rows are ordered ascending by candidate and the order is part of the contract: the Candidates Service renders `sdk list` straight from it. There is no pagination - the registry is order-of-100 rows - and an empty registry answers an empty array. The `default` of each entry is derived on every request from the `stable` tag, falling back to the `lts` tag, and is never stored. The tag decides first, then the platform: `stable` on UNIVERSAL, then `stable` on LINUX_X64, then `lts` on UNIVERSAL, then `lts` on LINUX_X64. Only those four combinations produce a default, and only rows with no distribution count. An entry for java never carries a `default`."
      responses:
        "200":
          description: "OK"
          content:
            'application/json':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CandidateDto"
        "500":
          description: "Internal Server Error - Database error"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/candidates:
    post:
      description: "Register a candidate. The write is an upsert keyed on the identifier: an existing candidate has its name, description and website_url updated and its timestamp refreshed, and the identifier itself is never mutated - renaming a candidate is a delete plus a create. 201 and 200 are told apart by what the upsert reports rather than by a preceding read, so a concurrent double post cannot answer 201 twice. Registration grants publishing rights: POST /versions validates its candidate against this registry, so a newly registered candidate becomes publishable within the refresh interval, with no deploy and no restart. Admin and community tokens are admitted."
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
        required: true
      responses:
        "201":
          description: "Created - Candidate did not exist and was registered"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CandidateAdminDto"
        "200":
          description: "OK - Candidate existed and its metadata was updated"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CandidateAdminDto"
        "400":
          description: "Bad Request - Validation failure or malformed JSON. Malformed JSON is an accumulated validation failure on the `request` field, never a deserialisation 500."
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                validation_error:
                  summary: "Structural validation failure"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "website_url"
                        message: "URL 'http://gradle.org/' must be a valid HTTPS URL"
                malformed_json:
                  summary: "Body that is not valid JSON"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "request"
                        message: "Invalid JSON: Unexpected JSON token at offset 0"
        "401":
          description: "Unauthorized - Missing, invalid, or non-admin, non-community token"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error - Database error"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/candidates/{candidate}:
    delete:
      description: "Remove a candidate from the registry. Deletion is hard, not soft: a candidate carries no history worth preserving once its versions are gone, so the body is the removed record. A candidate that still has versions is refused with 409 and the count of those versions; the count is the whole guard, and no database constraint stands behind it. Deletion revokes publishing rights: POST /versions validates its candidate against this registry, so a deleted candidate stops being publishable within the refresh interval. Admin and community tokens are admitted."
      security:
        - bearerAuth: []
      parameters:
        - name: "candidate"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "The candidate identifier (e.g. gradle, java)"
      responses:
        "200":
          description: "OK - Candidate deleted; the body is the removed record"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CandidateAdminDto"
        "401":
          description: "Unauthorized - Missing, invalid, or non-admin, non-community token"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - No such candidate"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - The candidate still has versions, which must be removed first"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CandidateConflictResponse"
              examples:
                candidate_has_versions:
                  summary: "Candidate still has versions"
                  value:
                    error: "Conflict"
                    message: "Cannot delete candidate with existing versions. Remove the versions first."
                    version_count: 2
        "500":
          description: "Internal Server Error - Database error"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /validate/versions:
    post:
      description: "Validate a POST /versions body without writing it and without a login. Takes exactly the POST /versions body and runs the same validation, so a 400 is identical to the one POST /versions gives for the same body. A token, if sent, changes nothing. A 204 is a prediction, not a promise: the write can still fail on authorization, a database error, or a registry change in between. Answers may lag a registry change by up to the registry refresh interval. Validation reads nothing from the database per request and is not throttled."
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Version"
        required: true
      responses:
        "204":
          description: "No Content - POST /versions would accept this body"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: "Bad Request - Validation failed; identical to the POST /versions answer for the same body. Java is rejected, identifying the candidate field and naming POST /versions/java, which has no validate twin."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                java_candidate:
                  summary: "Java belongs on POST /versions/java"
                  value:
                    error: "Validation failed"
                    failures:
                      - field: "candidate"
                        message: "candidate 'java' is not accepted here; use POST /versions/java"
        "413":
          description: "Content Too Large - The body exceeds 16384 bytes and is refused unread"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "500":
          description: "Internal Server Error - The candidate registry has never loaded successfully, as for POST /versions"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                registry_unavailable:
                  description: "The candidate registry has never loaded successfully"
                  value:
                    error: "Internal Server Error"
                    message: "Candidate registry unavailable"
  /validate/candidates:
    post:
      description: "Validate a POST /admin/candidates body without writing it and without a login. Takes exactly the POST /admin/candidates body and runs the same validation, so a 400 is identical to the one POST /admin/candidates gives for the same body. A token, if sent, changes nothing. A 204 is a prediction, not a promise: the write can still fail on authorization or a database error."
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
        required: true
      responses:
        "204":
          description: "No Content - POST /admin/candidates would accept this body"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: "Bad Request - Validation failure or malformed JSON; identical to the POST /admin/candidates answer for the same body"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "413":
          description: "Content Too Large - The body exceeds 16384 bytes and is refused unread"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
  /versions/{candidate}:
    get:
      description: "List versions for a candidate, optionally filtered by platform, distribution, and visibility."
      parameters:
        - name: "candidate"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "platform"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "LINUX_X32"
              - "LINUX_X64"
              - "LINUX_ARM32HF"
              - "LINUX_ARM32SF"
              - "LINUX_ARM64"
              - "MAC_X64"
              - "MAC_ARM64"
              - "WINDOWS_X64"
              - "UNIVERSAL"
          description: "Canonical platform enum value. Absent means no platform filter (all platforms)."
        - name: "distribution"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "BISHENG"
              - "CORRETTO"
              - "ELIYA"
              - "GRAALCE"
              - "GRAALVM"
              - "JETBRAINS"
              - "KONA"
              - "LIBERICA"
              - "LIBERICA_NIK"
              - "MANDREL"
              - "MICROSOFT"
              - "OPENJDK"
              - "ORACLE"
              - "SAP_MACHINE"
              - "SEMERU"
              - "TEMURIN"
              - "ZULU"
          description: "Canonical distribution enum value. Absent means no distribution filter."
        - name: "visible"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "true"
              - "false"
              - "all"
            default: "true"
          description: "Visibility filter. 'true' returns visible versions only (default), 'false' returns hidden versions only, 'all' applies no visibility filter."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Version"
        "400":
          description: "Bad Request - Invalid query parameter value, or missing/blank candidate path parameter"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /versions/{candidate}/tags/{tag}:
    get:
      description: "Resolve a tag to the single version it points to within the given candidate, distribution, and platform scope"
      parameters:
        - name: "candidate"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "The candidate name (e.g. java, scala)"
        - name: "tag"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "The tag to resolve (e.g. lts, latest)"
        - name: "platform"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "LINUX_X32"
              - "LINUX_X64"
              - "LINUX_ARM32HF"
              - "LINUX_ARM32SF"
              - "LINUX_ARM64"
              - "MAC_X64"
              - "MAC_ARM64"
              - "WINDOWS_X64"
              - "UNIVERSAL"
          description: "Canonical platform enum value. Required — UNIVERSAL must be requested explicitly."
        - name: "distribution"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "BISHENG"
              - "CORRETTO"
              - "ELIYA"
              - "GRAALCE"
              - "GRAALVM"
              - "JETBRAINS"
              - "KONA"
              - "LIBERICA"
              - "LIBERICA_NIK"
              - "MANDREL"
              - "MICROSOFT"
              - "OPENJDK"
              - "ORACLE"
              - "SAP_MACHINE"
              - "SEMERU"
              - "TEMURIN"
              - "ZULU"
          description: "Canonical distribution enum value. Absent resolves the version tagged for the candidate with no distribution."
      responses:
        "200":
          description: "OK - Tag resolved successfully"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: "Bad Request - Missing or invalid required parameter (platform), invalid distribution, or missing/blank candidate or tag"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - No version carries this tag in the given scope"
          content:
            '*/*':
              schema:
                type: "object"
  /versions/{candidate}/{version}:
    get:
      description: "Fetch a single version uniquely identified by candidate, version, platform, and optional distribution."
      parameters:
        - name: "candidate"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "platform"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "LINUX_X32"
              - "LINUX_X64"
              - "LINUX_ARM32HF"
              - "LINUX_ARM32SF"
              - "LINUX_ARM64"
              - "MAC_X64"
              - "MAC_ARM64"
              - "WINDOWS_X64"
              - "UNIVERSAL"
          description: "Canonical platform enum value. Required — UNIVERSAL must be requested explicitly."
        - name: "distribution"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "BISHENG"
              - "CORRETTO"
              - "ELIYA"
              - "GRAALCE"
              - "GRAALVM"
              - "JETBRAINS"
              - "KONA"
              - "LIBERICA"
              - "LIBERICA_NIK"
              - "MANDREL"
              - "MICROSOFT"
              - "OPENJDK"
              - "ORACLE"
              - "SAP_MACHINE"
              - "SEMERU"
              - "TEMURIN"
              - "ZULU"
          description: "Canonical distribution enum value. Absent applies no distribution filter."
      responses:
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "object"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: "Bad Request - Missing or invalid required parameter (platform), invalid distribution, or missing/blank candidate or version"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
