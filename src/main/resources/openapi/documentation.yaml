      type: "object"
      properties:
        field:
          type: "string"
        message:
          type: "string"
      required:
        - "field"
        - "message"
    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
        message:
          type: "string"
      required:
        - "error"
        - "message"
    TagConflictResponse:
      type: "object"
      properties:
        error:
          type: "string"
        message:
          type: "string"
        tags:
          type: "array"
          items:
            type: "string"
      required:
        - "error"
        - "message"
        - "tags"
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    LoginResponse:
      type: "object"
      properties:
        token:
          type: "string"
      required:
        - "token"
    CreateVendorRequest:
      type: "object"
      properties:
        email:
          type: "string"
        candidates:
          type: "array"
          items:
            type: "string"
          description: "List of candidate identifiers the vendor is authorized to manage. Omit to preserve existing candidates on update."
      required:
        - "email"
    VendorResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
        candidates:
          type: "array"
          items:
            type: "string"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
        deleted_at:
          type: "string"
          format: "date-time"
          nullable: true
      required:
        - "id"
        - "email"
        - "candidates"
        - "created_at"
        - "updated_at"
    VendorWithPasswordResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
        password:
          type: "string"
          description: "Generated plaintext password, shown only on create/update"
        candidates:
          type: "array"
          items:
            type: "string"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "email"
        - "password"
        - "candidates"
        - "created_at"
        - "updated_at"
    CreateCandidateRequest:
      type: "object"
      properties:
        candidate:
          type: "string"
          pattern: "^[a-z][a-z0-9]*$"
          maxLength: 20
          description: "Candidate identifier. Lowercase and case-sensitive: 'Java' is not 'java' and is rejected by the pattern."
        name:
          type: "string"
          maxLength: 100
          description: "Display name, e.g. Gradle"
        description:
          type: "string"
          maxLength: 2000
          description: "Free text rendered into a fixed-width terminal box by `sdk list`, so it must be a single paragraph of printable ASCII: every character in 0x20-0x7E, no control characters, no line breaks, and no runs of consecutive spaces."
        website_url:
          type: "string"
          maxLength: 500
          description: "Absolute URL. The https scheme is required; anything else is rejected on write."
      required:
        - "candidate"
        - "name"
        - "description"
        - "website_url"
    CandidateDto:
      type: "object"
      properties:
        candidate:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        website_url:
          type: "string"
        default:
          type: "string"
          description: "The version carrying the `stable` tag, falling back to the `lts` tag. The tag decides first, then the platform: `stable` on UNIVERSAL, then `stable` on LINUX_X64, then `lts` on UNIVERSAL, then `lts` on LINUX_X64. Only those four combinations count; any other tag or platform never produces a default. Only rows with no distribution are considered. Derived from version_tags on every request and never stored. The field is absent - not null - when no tag resolves, and always absent for java, which is the one candidate with per-distribution tags."
      required:
        - "candidate"
        - "name"
        - "description"
        - "website_url"
    CandidateAdminDto:
      type: "object"
      properties:
        candidate:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        website_url:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
          description: "The JSON field is updated_at, matching VendorResponse; the column behind it is last_updated_at, matching versions and version_tags."
      required:
        - "candidate"
        - "name"
        - "description"
        - "website_url"
        - "created_at"
        - "updated_at"
    CandidateConflictResponse:
      type: "object"
      properties:
        error:
          type: "string"
        message:
          type: "string"
        version_count:
          type: "integer"
          format: "int64"
          description: "How many versions the candidate still has. Carried structurally, as TagConflictResponse carries its tags, so a caller can act on it without parsing the message."
      required:
        - "error"
        - "message"
        - "version_count"
    Version:
      type: "object"
      properties:
        candidate:
          type: "string"
        version:
          type: "string"
          description: "Version identifier. On POST /versions it must not be blank, and no format is enforced. Java versions are posted to POST /versions/java, whose JavaVersion body states the java grammar."
        platform:
          type: "string"
          enum:
            - "LINUX_X32"
            - "LINUX_X64"
            - "LINUX_ARM32HF"
            - "LINUX_ARM32SF"
            - "LINUX_ARM64"
            - "MAC_X64"
            - "MAC_ARM64"
            - "WINDOWS_X64"
            - "UNIVERSAL"
        url:
          type: "string"
        visible:
          type: "boolean"
        distribution:
          type: "string"
          enum:
            - "BISHENG"
            - "CORRETTO"
            - "ELIYA"
            - "GRAALCE"
            - "GRAALVM"
            - "JETBRAINS"
            - "KONA"
            - "LIBERICA"
            - "LIBERICA_NIK"
            - "MANDREL"
            - "MICROSOFT"
            - "OPENJDK"
            - "ORACLE"
            - "SAP_MACHINE"
            - "SEMERU"
            - "TEMURIN"
            - "ZULU"
        md5sum:
          type: "string"
        sha256sum:
          type: "string"
        sha512sum:
          type: "string"
        tags:
          type: "array"
          items:
            type: "string"
            pattern: "^[a-zA-Z0-9]([a-zA-Z0-9._-]{0,48}[a-zA-Z0-9])?$"
            maxLength: 50
          example:
            - "latest"
            - "27"
            - "27.0"
            - "lts"
          description: "Version tags (e.g. latest, 27, 27.1). Tags must start and end with alphanumeric characters and may contain dots, hyphens, and underscores. On POST: absent preserves existing tags, empty array clears all tags, non-empty array replaces all tags. Tags are mutually exclusive within (candidate, distribution, platform) scope. Always present in GET responses as an array (empty if no tags)."
      required:
        - "candidate"
        - "version"
        - "platform"
        - "url"
        - "visible"
    JavaVersion:
      type: "object"
      description: "The POST /versions/java body. The route fixes the candidate, so there is no candidate field, and a body carrying one is rejected with 400 naming the field."
      properties:
        version:
          type: "string"
          description: "Version identifier. A vendor's version must conform to FEATURE.INTERIM.UPDATE.PATCH[.N...][-fx|-crac][+build-metadata] where FEATURE, INTERIM, UPDATE and PATCH are four mandatory non-negative integers without leading zeros, trailing elements are further dot-separated non-negative integers without leading zeros, the last trailing element is not 0, variant is exactly one of 'fx' or 'crac' (case-sensitive), and build metadata is plus-separated dot-delimited identifiers [a-zA-Z0-9-]+. The admin may also send a legacy version that fails the grammar; it is stored as given."
        platform:
          type: "string"
          enum:
            - "LINUX_X32"
            - "LINUX_X64"
            - "LINUX_ARM32HF"
            - "LINUX_ARM32SF"
            - "LINUX_ARM64"
            - "MAC_X64"
            - "MAC_ARM64"
            - "WINDOWS_X64"
            - "UNIVERSAL"
        url:
          type: "string"
          description: "An https URL"
        distribution:
          type: "string"
          enum:
            - "BISHENG"
            - "CORRETTO"
            - "ELIYA"
            - "GRAALCE"
            - "GRAALVM"
            - "JETBRAINS"
            - "KONA"
            - "LIBERICA"
            - "LIBERICA_NIK"
            - "MANDREL"
            - "MICROSOFT"
            - "OPENJDK"
            - "ORACLE"
            - "SAP_MACHINE"
            - "SEMERU"
            - "TEMURIN"
            - "ZULU"
        md5sum:
          type: "string"
        sha256sum:
          type: "string"
        sha512sum:
          type: "string"
        visible:
          type: "boolean"
          description: "Admin only: a vendor body carrying it is rejected with 400 naming the field, because State decides a vendor post's visibility. Absent means true."
        tags:
          type: "array"
          items:
            type: "string"
            pattern: "^[a-zA-Z0-9]([a-zA-Z0-9._-]{0,48}[a-zA-Z0-9])?$"
            maxLength: 50
          example:
            - "lts"
            - "25"
          description: "Admin only: a vendor body carrying it, even as an empty array, is rejected with 400 naming the field, because State moves a vendor post's tags. The posted row ends up holding exactly these tags, and absent means no tags. Tags are mutually exclusive within (candidate, distribution, platform) scope, so a listed tag moves off whichever row held it."
      required:
        - "version"
        - "platform"
        - "url"