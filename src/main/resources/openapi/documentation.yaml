            - "OPENJDK"
            - "ORACLE"
            - "SAP_MACHINE"
            - "SEMERU"
            - "TEMURIN"
            - "ZULU"
        platform:
          type: "string"
          enum:
            - "LINUX_X32"
            - "LINUX_X64"
            - "LINUX_ARM32HF"
            - "LINUX_ARM32SF"
            - "LINUX_ARM64"
            - "MAC_X64"
            - "MAC_ARM64"
            - "WINDOWS_X64"
            - "UNIVERSAL"
      required:
        - "candidate"
        - "version"
        - "platform"
    JavaUniqueVersion:
      type: "object"
      description: "Identifies one java row for DELETE /versions/java. The route fixes the candidate, so there is no candidate field, and a body carrying one is rejected with 400."
      properties:
        version:
          type: "string"
          description: "Any stored version string, legacy spellings included"
        distribution:
          type: "string"
