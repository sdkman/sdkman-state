            - "ELIYA"
            - "GRAALCE"
            - "GRAALVM"
            - "JETBRAINS"
            - "KONA"
            - "LIBERICA"
            - "LIBERICA_NIK"
            - "MANDREL"
            - "MICROSOFT"
            - "OPENJDK"
            - "ORACLE"
            - "SAP_MACHINE"
            - "SEMERU"
            - "TEMURIN"
