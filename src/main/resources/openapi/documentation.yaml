      schema:
        type: "string"
        enum:
          - "no-store"
    NoStoreWrite:
      description: "The answer to a write request must not be cached"
      schema:
        type: "string"
        enum:
          - "no-store"
  schemas:
    HealthCheckResponse:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "SUCCESS"
            - "FAILURE"
        message:
          type: "string"
          nullable: true
      required:
        - "status"
    UniqueVersion:
